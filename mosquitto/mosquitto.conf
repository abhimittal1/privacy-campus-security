# ── Mosquitto configuration ───────────────────────────────────────────────────
# Plain MQTT listener (internal / localhost-only in production; open for dev)
listener 1883
allow_anonymous true

# MQTT-over-WebSocket (useful for browser clients)
listener 9001
protocol websockets
allow_anonymous true

# Persistence (stored under the named Docker volume)
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest stdout
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
