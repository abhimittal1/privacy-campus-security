[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "privacy-campus-security"
version = "0.1.0"
description = "Privacy-preserving few-shot face recognition for campus security"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "Pillow>=10.0",
    "opencv-python>=4.8",
    "scikit-learn>=1.4",
    "numpy>=1.26",
    "flask>=3.0",
    "flask-socketio>=5.3",
    "cryptography>=42.0",
    "tqdm>=4.66",
    "requests>=2.31",
    "paho-mqtt>=2.0",
    "PyYAML>=6.0",
    "prometheus_client>=0.20",
    "structlog>=24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.5",
    "black>=24.0",
    "isort>=5.13",
    "ruff>=0.4",
    "flake8>=7.0",
    "flake8-bugbear>=24.0",
    "mypy>=1.9",
    "pre-commit>=3.7",
]

[project.scripts]
pcs = "src.cli.run:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

# ── Black ──────────────────────────────────────────────────────────────────────
[tool.black]
line-length = 100
target-version = ["py311", "py312"]
include = '\.pyi?$'

# ── isort ─────────────────────────────────────────────────────────────────────
[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["src"]

# ── Flake8 is configured in .flake8 (does not support pyproject.toml natively)

# ── pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

# ── mypy ──────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true   # third-party stubs are often absent
strict = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
# Per-module relaxations for generated/vendored code
[[tool.mypy.overrides]]
module = ["tests.*", "conftest"]
disallow_untyped_defs = false
disallow_untyped_calls = false

# ── Ruff (supersedes most of flake8 + bugbear + isort linting) ────────────────
[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "dist", "build", "*.egg-info", "experiments", "docs"]

[tool.ruff.lint]
# E/W = pycodestyle, F = pyflakes, B = bugbear, I = isort, UP = pyupgrade
select = ["E", "W", "F", "B", "I", "UP"]
ignore = [
    "E203",   # whitespace before ':' — Black produces this
    "B008",   # do not perform function calls in default arguments
]

[tool.ruff.lint.per-file-ignores]
"tests/*"    = ["ANN", "S101"]  # asserts + missing annotations fine in tests
"src/cli/*"  = ["ANN"]          # CLI glue needs loose annotations
