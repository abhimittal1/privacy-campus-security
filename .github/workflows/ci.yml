# ──────────────────────────────────────────────────────────────────────────────
# Privacy Campus Security — GitHub Actions CI / CD Pipeline
#
# Triggers
#   • Every push to every branch  → lint + test
#   • Every pull-request          → lint + test
#   • Push to `main`              → lint + test + docker build + push (GHCR)
#   • Push of a semver tag v*.*.*  → lint + test + docker build + push (GHCR)
#
# Container registry
#   Images are pushed to GitHub Container Registry (ghcr.io) using the
#   automatically-injected GITHUB_TOKEN — no extra secret required.
#
#   To push to Docker Hub instead, add these repository secrets and swap the
#   login step below:
#     DOCKERHUB_USERNAME  ← your Docker Hub username
#     DOCKERHUB_TOKEN     ← Docker Hub access token
# ──────────────────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: ["**"]        # every branch push triggers lint + test
    tags: ["v*.*.*"]        # semver tags additionally trigger image push
  pull_request:
    branches: ["**"]

# Cancel in-progress runs for the same branch / PR to save runner minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Registry & image name — override via repository variables if needed
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ── 1. Lint ──────────────────────────────────────────────────────────────────
  lint:
    name: "Lint — ruff + flake8"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install linting tools
        run: |
          pip install --upgrade pip
          pip install "ruff>=0.4" "flake8>=7.0" "flake8-bugbear>=24.0"

      - name: ruff check (fast linter)
        run: ruff check src/ tests/

      - name: ruff format --check (formatting gate)
        run: ruff format --check src/ tests/

      - name: flake8 (secondary style + bugbear pass)
        run: flake8 src/ tests/

  # ── 2. Tests ─────────────────────────────────────────────────────────────────
  test:
    name: "Tests — Python ${{ matrix.python-version }}"
    runs-on: ubuntu-latest
    needs: lint

    strategy:
      fail-fast: false
      matrix:
        # Matrix is ready for additional versions (e.g. "3.12") — the project
        # currently pins to 3.11 as the minimum supported interpreter.
        python-version: ["3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install runtime + dev dependencies
        run: |
          pip install --upgrade pip
          # Install package in editable mode (registers entry-points etc.)
          pip install -e "."
          # Install dev/test extras on top
          pip install -r requirements-dev.txt

      - name: Run unit tests with coverage
        run: |
          python -m pytest tests/ \
            --ignore=tests/integration \
            -q \
            --tb=short \
            --cov=src \
            --cov-report=xml \
            --cov-report=term-missing
        env:
          # Silence SocketIO / Flask "server is not running" warnings in tests
          PCS_LOG_LEVEL: WARNING

      - name: Upload coverage to Codecov
        # Only upload from the primary matrix leg to avoid duplicate reports
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false   # don't break CI on Codecov outages
        env:
          # Add CODECOV_TOKEN to your repository secrets to enable coverage reports
          # CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}  # ← uncomment when ready
          CODECOV_TOKEN: ""

  # ── 3. Docker build (+ conditional push) ─────────────────────────────────────
  docker:
    name: "Docker — build${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && ' + push' || '' }}"
    runs-on: ubuntu-latest
    needs: [lint, test]

    permissions:
      contents: read
      packages: write   # required to push to ghcr.io

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Enable multi-platform builds and layer-cache support
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Log in to GHCR (only when we intend to push) ─────────────────────────
      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}    # auto-injected — no extra secret needed

      # ── Placeholder: Docker Hub login (uncomment + add secrets to use) ────────
      # - name: Log in to Docker Hub
      #   if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
      #   uses: docker/login-action@v3
      #   with:
      #     registry: docker.io
      #     username: ${{ secrets.DOCKERHUB_USERNAME }}   # ← add to repo secrets
      #     password: ${{ secrets.DOCKERHUB_TOKEN }}      # ← add to repo secrets

      # ── Generate image tags & OCI labels automatically ────────────────────────
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # vX.Y.Z tag  → ghcr.io/org/repo:X.Y.Z  and  :X.Y
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # Branch push → ghcr.io/org/repo:main  (or :my-branch)
            type=ref,event=branch
            # PR          → ghcr.io/org/repo:pr-42
            type=ref,event=pr
            # Short SHA   → ghcr.io/org/repo:sha-a1b2c3d  (always present)
            type=sha,prefix=sha-

      # ── Build (and push when on main / tag) ───────────────────────────────────
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64          # extend to linux/arm64 for multi-arch
          push: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Re-use cached layers from previous runs to speed up builds
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1

      # ── Summary ───────────────────────────────────────────────────────────────
      - name: Write job summary
        if: always()
        run: |
          echo "### Docker Image" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Registry | \`${{ env.REGISTRY }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Image | \`${{ env.IMAGE_NAME }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Tags | \`${{ steps.meta.outputs.tags }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Pushed | \`${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}\` |" >> $GITHUB_STEP_SUMMARY
